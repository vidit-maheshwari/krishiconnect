version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5100:5100"
    environment:
      - MONGODB=mongodb://mongodb:27017/sensorDataDB
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEOLOCATION_API_KEY=${GEOLOCATION_API_KEY}
      - PORT=5100
    depends_on:
      - mongodb
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data: 